version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: appdb

  backend:
    build: ./backend
    container_name: node-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: react-frontend
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  mongo_data:
